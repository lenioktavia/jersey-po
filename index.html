<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jersey PO Tracker</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e6e9ef;
  --primary:#111827;--blue:#2563eb;--purple:#7c3aed;--orange:#ea580c;
  --green:#16a34a;--red:#dc2626;--yellow:#d97706;--shadow:0 8px 28px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:#111827;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:20px;padding:8px 10px 25px}
.logo span{color:#93c5fd}
.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px;border-radius:10px;margin:3px 0}
.nav button.active,.nav button:hover{background:#1f2937;color:#fff}
.main{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:5}
.topbar h1{margin:0;font-size:22px}
.topbar small{color:var(--muted)}
.content{padding:24px 28px;max-width:1500px;margin:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:220px}
input,textarea,select{width:100%;border:1px solid #dfe3ea;border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}.btn-light{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn-danger{background:#fee2e2;color:#b91c1c}.btn-small{padding:8px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}
.stat b{font-size:24px}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:18px}
.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px;font-size:13px}
.filter.active{background:#111827;color:#fff;border-color:#111827}
.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.order{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.priority-strip{height:5px;background:#d1d5db}.priority-strip.segera{background:#f59e0b}.priority-strip.prioritas{background:#ef4444}.priority-strip.terlambat{background:#991b1b}
.design{height:190px;background:#eef1f5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.design img{width:100%;height:100%;object-fit:cover}
.placeholder{color:#9ca3af;font-size:14px;text-align:center;padding:20px}
.cardbody{padding:15px}
.row-between{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.orderid{font-weight:800;font-size:15px;word-break:break-all}
.buyer{font-size:18px;font-weight:750;margin-top:4px}
.deadline{margin:13px 0;padding:10px 11px;border-radius:10px;background:#f8fafc;display:flex;justify-content:space-between;gap:10px}
.deadline strong{font-size:13px}.deadline small{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.baru{background:#f1f5f9;color:#475569}.badge.maintenance{background:#dbeafe;color:#1d4ed8}.badge.print{background:#ede9fe;color:#6d28d9}.badge.jahit{background:#ffedd5;color:#c2410c}.badge.kirim{background:#dcfce7;color:#15803d}.badge.selesai{background:#dcfce7;color:#15803d}
.priority{font-size:11px;font-weight:900;padding:5px 8px;border-radius:7px;background:#fee2e2;color:#b91c1c;margin-bottom:9px;display:inline-block}
.custom{border:1px solid var(--line);border-radius:10px;padding:11px;margin:11px 0}
.custom-grid{display:grid;grid-template-columns:1fr 75px;gap:12px}
.label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.value{font-weight:800;margin-top:2px}
.note{color:#4b5563;font-size:13px;line-height:1.45;white-space:pre-wrap}
.drive{display:block;margin-top:10px;color:#2563eb;text-decoration:none;font-weight:700;font-size:13px}
.actions{display:flex;gap:8px;margin-top:13px}.actions .btn{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;background:#fff;border:1px dashed #d5dae3;border-radius:16px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modalhead h2{margin:0;font-size:20px}.close{border:0;background:#f1f5f9;border-radius:9px;padding:7px 10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.preview{width:100%;max-height:240px;object-fit:contain;background:#f1f5f9;border-radius:12px;margin-top:8px;display:none}
.detail-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.detail-img{width:100%;height:280px;object-fit:cover;background:#f1f5f9;border-radius:12px}
.detail-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-item{border:1px solid var(--line);border-radius:10px;padding:10px}.detail-item.full{grid-column:1/-1}
.history{margin-top:18px}.history-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.dot{width:9px;height:9px;background:#111827;border-radius:50%;margin-top:6px;flex:none}.history small{color:var(--muted)}
@media(max-width:1100px){.orders{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.sidebar{display:none}.topbar{padding:15px 17px}.content{padding:17px}.stats{grid-template-columns:repeat(2,1fr)}.orders{grid-template-columns:1fr}.detail-layout{grid-template-columns:1fr}.detail-img{height:240px}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.formgrid,.detail-list{grid-template-columns:1fr}.field.full,.detail-item.full{grid-column:auto}.topbar h1{font-size:18px}.content{padding:13px}.design{height:180px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">Jersey <span>PO</span></div>
    <div class="nav">
      <button class="active" onclick="showDashboard()">Dashboard</button>
      <button onclick="showDashboard()">Order</button>
      <button onclick="openForm()">+ Tambah Order</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1>Produksi Pre Order</h1><small>Tracking order jersey Shopee</small></div>
      <button class="btn btn-primary" onclick="openForm()">+ Tambah Order</button>
    </header>

    <section class="content">
      <div class="stats">
        <div class="stat"><b id="total">0</b><span>Total Order</span></div>
        <div class="stat"><b id="today">0</b><span>Deadline Hari Ini</span></div>
        <div class="stat"><b id="urgent">0</b><span>Prioritas</span></div>
        <div class="stat"><b id="late">0</b><span>Terlambat</span></div>
      </div>

      <div class="toolbar">
        <input id="search" class="search" placeholder="Cari nomor order, pembeli, atau nama custom..." oninput="render()">
        <button class="btn btn-primary" onclick="openForm()">+ Tambah Order</button>
      </div>

      <div class="filters" id="filters">
        <button class="filter active" data-filter="all">Semua</button>
        <button class="filter" data-filter="BARU">Baru</button>
        <button class="filter" data-filter="MAINTENANCE DESAIN">Maintenance Desain</button>
        <button class="filter" data-filter="PRINT PRESS">Print Press</button>
        <button class="filter" data-filter="JAHIT">Jahit</button>
        <button class="filter" data-filter="KIRIM KE EKSPEDISI">Kirim ke Ekspedisi</button>
        <button class="filter" data-filter="SELESAI">Selesai</button>
        <button class="filter" data-filter="prioritas">Prioritas</button>
        <button class="filter" data-filter="today">Deadline Hari Ini</button>
        <button class="filter" data-filter="late">Terlambat</button>
      </div>

      <div id="orders" class="orders"></div>
    </section>
  </main>
</div>

<!-- FORM -->
<div id="formModal" class="modal">
  <div class="modalbox">
    <div class="modalhead"><h2 id="formTitle">Tambah Order</h2><button class="close" onclick="closeModal('formModal')">✕</button></div>
    <form id="orderForm" onsubmit="saveOrder(event)">
      <input type="hidden" id="editId">
      <div class="formgrid">
        <div class="field"><label>Nomor Order Shopee *</label><input id="orderNo" required></div>
        <div class="field"><label>Nama Pembeli *</label><input id="buyer" required></div>
        <div class="field"><label>Tanggal Order *</label><input id="orderDate" type="date" required></div>
        <div class="field"><label>Batas Pengiriman *</label><input id="deadline" type="date" required></div>
        <div class="field"><label>Foto / Gambar Desain</label><input id="imageFile" type="file" accept="image/*" onchange="previewFile(event)"><img id="preview" class="preview"></div>
        <div class="field"><label>Link Google Drive Desain</label><input id="drive" type="url" placeholder="https://drive.google.com/..."></div>
        <div class="field"><label>Custom Nama</label><input id="customName" placeholder="Contoh: ANDI"></div>
        <div class="field"><label>Nomor Punggung</label><input id="number" placeholder="Contoh: 10"></div>
        <div class="field full"><label>Catatan Custom / Tambahan</label><textarea id="note" rows="3" placeholder="Contoh: Nomor putih, ukuran besar..."></textarea></div>
      </div>
      <div class="form-actions"><button type="button" class="btn btn-light" onclick="closeModal('formModal')">Batal</button><button class="btn btn-primary">Simpan Order</button></div>
    </form>
  </div>
</div>

<!-- DETAIL -->
<div id="detailModal" class="modal">
  <div class="modalbox">
    <div class="modalhead"><h2>Detail Order</h2><button class="close" onclick="closeModal('detailModal')">✕</button></div>
    <div id="detailContent"></div>
  </div>
</div>

<script>
const KEY='jersey_po_orders_v1';
const statuses=['BARU','MAINTENANCE DESAIN','PRINT PRESS','JAHIT','KIRIM KE EKSPEDISI','SELESAI'];
let orders=JSON.parse(localStorage.getItem(KEY)||'[]');
let currentFilter='all';
let pendingImage=null;

function saveData(){localStorage.setItem(KEY,JSON.stringify(orders));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function fmtDate(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function fmtDateTime(s){return new Date(s).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function daysLeft(deadline){
  const a=new Date(todayStr()+'T00:00:00'), b=new Date(deadline+'T00:00:00');
  return Math.ceil((b-a)/86400000);
}
function priority(deadline){
  const d=daysLeft(deadline);
  if(d<0)return ['TERLAMBAT','terlambat'];
  if(d<=1)return ['PRIORITAS','prioritas'];
  if(d<=2)return ['SEGERA','segera'];
  return ['AMAN','aman'];
}
function statusClass(s){
  return {'BARU':'baru','MAINTENANCE DESAIN':'maintenance','PRINT PRESS':'print','JAHIT':'jahit','KIRIM KE EKSPEDISI':'kirim','SELESAI':'selesai'}[s]||'baru';
}
function statusLabel(s){return s==='MAINTENANCE DESAIN'?'Maintenance Desain':s==='PRINT PRESS'?'Print Press':s==='KIRIM KE EKSPEDISI'?'Kirim ke Ekspedisi':s.charAt(0)+s.slice(1).toLowerCase()}
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  let list=[...orders].filter(o=>{
    const hay=(o.orderNo+' '+o.buyer+' '+o.customName).toLowerCase();
    if(q && !hay.includes(q))return false;
    const [p]=priority(o.deadline);
    if(currentFilter==='all')return true;
    if(statuses.includes(currentFilter))return o.status===currentFilter;
    if(currentFilter==='prioritas')return p==='PRIORITAS'||p==='SEGERA';
    if(currentFilter==='today')return o.deadline===todayStr();
    if(currentFilter==='late')return p==='TERLAMBAT';
    return true;
  });
  list.sort((a,b)=>{
    if(a.status==='SELESAI' && b.status!=='SELESAI')return 1;
    if(b.status==='SELESAI' && a.status!=='SELESAI')return -1;
    return a.deadline.localeCompare(b.deadline);
  });
  document.getElementById('total').textContent=orders.length;
  document.getElementById('today').textContent=orders.filter(o=>o.deadline===todayStr()&&o.status!=='SELESAI').length;
  document.getElementById('urgent').textContent=orders.filter(o=>['PRIORITAS','SEGERA'].includes(priority(o.deadline)[0])&&o.status!=='SELESAI').length;
  document.getElementById('late').textContent=orders.filter(o=>priority(o.deadline)[0]==='TERLAMBAT'&&o.status!=='SELESAI').length;
  const box=document.getElementById('orders');
  if(!list.length){box.innerHTML='<div class="empty"><b>Tidak ada order</b><br><small>Tambahkan order Shopee untuk mulai tracking produksi.</small></div>';return}
  box.innerHTML=list.map(card).join('');
}
function card(o){
  const [p,pc]=priority(o.deadline), sc=statusClass(o.status);
  const image=o.image?`<img src="${o.image}" alt="Desain">`:'<div class="placeholder">Belum ada desain</div>';
  const drive=o.drive?`<a class="drive" href="${esc(o.drive)}" target="_blank" rel="noopener">↗ Buka Google Drive</a>`:'';
  return `<article class="order">
    <div class="priority-strip ${pc}"></div>
    <div class="design">${image}</div>
    <div class="cardbody">
      ${o.status!=='SELESAI'&&p!=='AMAN'?`<span class="priority">${p}</span>`:''}
      <div class="row-between"><div><div class="label">Order Shopee</div><div class="orderid">${esc(o.orderNo)}</div><div class="buyer">${esc(o.buyer)}</div></div><span class="badge ${sc}">${statusLabel(o.status)}</span></div>
      <div class="deadline"><div><div class="label">Deadline</div><strong>${fmtDate(o.deadline)}</strong></div><div style="text-align:right"><small>${deadlineText(o.deadline,o.status)}</small></div></div>
      <div class="custom"><div class="label">Custom</div><div class="custom-grid"><div><div class="label">Nama</div><div class="value">${esc(o.customName||'-')}</div></div><div><div class="label">No</div><div class="value">${esc(o.number||'-')}</div></div></div>${o.note?`<div style="margin-top:9px"><div class="label">Catatan</div><div class="note">${esc(o.note)}</div></div>`:''}</div>
      ${drive}
      <div class="actions"><button class="btn btn-light btn-small" onclick="openDetail('${o.id}')">Detail</button><button class="btn btn-primary btn-small" onclick="nextStatus('${o.id}')">${o.status==='SELESAI'?'Selesai':'Ubah Status'}</button></div>
    </div>
  </article>`;
}
function deadlineText(d,s){
  if(s==='SELESAI')return 'Selesai';
  const n=daysLeft(d);
  if(n<0)return `Lewat ${Math.abs(n)} hari`;
  if(n===0)return 'Hari ini';
  if(n===1)return 'Besok';
  return `${n} hari lagi`;
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openForm(id=null){
  pendingImage=null;
  document.getElementById('orderForm').reset();
  document.getElementById('editId').value='';
  document.getElementById('preview').style.display='none';
  document.getElementById('formTitle').textContent=id?'Edit Order':'Tambah Order';
  document.getElementById('orderDate').value=todayStr();
  if(id){
    const o=orders.find(x=>x.id===id); if(!o)return;
    document.getElementById('editId').value=o.id;
    document.getElementById('orderNo').value=o.orderNo;
    document.getElementById('buyer').value=o.buyer;
    document.getElementById('orderDate').value=o.orderDate;
    document.getElementById('deadline').value=o.deadline;
    document.getElementById('drive').value=o.drive||'';
    document.getElementById('customName').value=o.customName||'';
    document.getElementById('number').value=o.number||'';
    document.getElementById('note').value=o.note||'';
    pendingImage=o.image||null;
    if(o.image){document.getElementById('preview').src=o.image;document.getElementById('preview').style.display='block'}
  }
  document.getElementById('formModal').classList.add('show');
}
function previewFile(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{pendingImage=reader.result;document.getElementById('preview').src=reader.result;document.getElementById('preview').style.display='block'};
  reader.readAsDataURL(file);
}
function saveOrder(e){
  e.preventDefault();
  const id=document.getElementById('editId').value;
  const base={orderNo:document.getElementById('orderNo').value.trim(),buyer:document.getElementById('buyer').value.trim(),orderDate:document.getElementById('orderDate').value,deadline:document.getElementById('deadline').value,drive:document.getElementById('drive').value.trim(),customName:document.getElementById('customName').value.trim().toUpperCase(),number:document.getElementById('number').value.trim(),note:document.getElementById('note').value.trim(),image:pendingImage};
  if(id){
    const o=orders.find(x=>x.id===id); Object.assign(o,base);
  }else{
    orders.push({id:uid(),...base,status:'BARU',history:[{status:'BARU',time:new Date().toISOString()}]});
  }
  saveData();closeModal('formModal');render();
}
function nextStatus(id){
  const o=orders.find(x=>x.id===id); if(!o)return;
  const i=statuses.indexOf(o.status);
  if(i<statuses.length-1){
    o.status=statuses[i+1]; o.history=o.history||[]; o.history.push({status:o.status,time:new Date().toISOString()});
    saveData();render();
  }else openDetail(id);
}
function changeStatus(id,val){
  const o=orders.find(x=>x.id===id); if(!o||o.status===val)return;
  o.status=val;o.history=o.history||[];o.history.push({status:val,time:new Date().toISOString()});
  saveData();render();openDetail(id);
}
function openDetail(id){
  const o=orders.find(x=>x.id===id); if(!o)return;
  const [p]=priority(o.deadline);
  const image=o.image?`<img class="detail-img" src="${o.image}" alt="Desain">`:`<div class="detail-img" style="display:flex;align-items:center;justify-content:center;color:#9ca3af">Belum ada desain</div>`;
  document.getElementById('detailContent').innerHTML=`
    <div class="detail-layout">${image}<div>
      <div class="label">Order Shopee</div><h3 style="margin:4px 0 15px">${esc(o.orderNo)}</h3>
      <div class="detail-list">
        <div class="detail-item"><div class="label">Pembeli</div><b>${esc(o.buyer)}</b></div>
        <div class="detail-item"><div class="label">Status</div><select onchange="changeStatus('${o.id}',this.value)">${statuses.map(s=>`<option ${s===o.status?'selected':''} value="${s}">${statusLabel(s)}</option>`).join('')}</select></div>
        <div class="detail-item"><div class="label">Tanggal Order</div><b>${fmtDate(o.orderDate)}</b></div>
        <div class="detail-item"><div class="label">Deadline</div><b>${fmtDate(o.deadline)} · ${p}</b></div>
        <div class="detail-item"><div class="label">Nama</div><b>${esc(o.customName||'-')}</b></div>
        <div class="detail-item"><div class="label">Nomor</div><b>${esc(o.number||'-')}</b></div>
        <div class="detail-item full"><div class="label">Catatan</div><div class="note">${esc(o.note||'-')}</div></div>
      </div>
      ${o.drive?`<a class="drive" href="${esc(o.drive)}" target="_blank" rel="noopener">↗ Buka File Desain di Google Drive</a>`:''}
    </div></div>
    <div class="history"><h3>Riwayat Status</h3>${(o.history||[]).slice().reverse().map(h=>`<div class="history-item"><span class="dot"></span><div><b>${statusLabel(h.status)}</b><br><small>${fmtDateTime(h.time)}</small></div></div>`).join('')}</div>
    <div class="form-actions"><button class="btn btn-light" onclick="openForm('${o.id}')">Edit Order</button><button class="btn btn-danger" onclick="deleteOrder('${o.id}')">Hapus Order</button></div>`;
  document.getElementById('detailModal').classList.add('show');
}
function deleteOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  if(confirm(`Hapus order ${o.orderNo}?`)){orders=orders.filter(x=>x.id!==id);saveData();closeModal('detailModal');render()}
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;render();
}));
window.addEventListener('click',e=>{if(e.target.classList.contains('modal'))e.target.classList.remove('show')});
render();
</script>
</body>
</html>
