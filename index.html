<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesanan Saya</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222}
button,input,select,textarea{font:inherit}
.app{max-width:1600px;margin:auto;padding:28px 24px}
h1{font-size:24px;margin:0 0 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{border:1px solid #ddd;background:#fff;border-radius:6px;padding:10px 18px;cursor:pointer}
.btn:hover{background:#f7f7f7}
.btn.primary{background:#ff4d3d;border-color:#ff4d3d;color:#fff}
.btn.danger{color:#e53935;border-color:#ffc9c5}
.tabs{display:flex;gap:34px;border-bottom:1px solid #ddd;margin-top:20px}
.tab{padding:14px 5px 18px;cursor:pointer}
.tab.active{color:#f4513d;font-weight:bold;border-bottom:3px solid #f4513d}
.filters{padding:24px 0 10px}
.filter-row{display:flex;gap:18px;margin-bottom:18px}
.field{height:40px;border:1px solid #ddd;border-radius:6px;padding:0 14px;background:#fff}
.search{flex:1}
.select{min-width:300px}
.statuses{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.pill{padding:9px 18px;border:1px solid #ddd;border-radius:22px;background:#fff;cursor:pointer}
.pill.active{border-color:#ff4d3d;color:#ff4d3d}
.summary{display:flex;justify-content:space-between;align-items:center;margin:24px 0 14px}
.summary strong{font-size:20px}
.table-wrap{overflow:auto;border:1px solid #ddd;border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:1050px}
th{background:#f7f7f7;color:#666;text-align:left;font-weight:normal;padding:15px 18px;border-bottom:1px solid #ddd}
td{padding:16px 18px;border-bottom:1px solid #eee;vertical-align:top}
.product{display:flex;gap:12px;min-width:390px}
.product img{width:68px;height:68px;object-fit:cover;border-radius:5px;border:1px solid #eee}
.product-title{font-weight:600;line-height:1.35}
.muted{color:#888;font-size:13px;margin-top:7px}
.badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:12px;background:#fff0ee;color:#f4513d}
.stage{font-weight:bold;margin-top:8px}
.link{color:#1677ff;text-decoration:none;display:block;margin:7px 0}
.link:hover{text-decoration:underline}
.actions{white-space:nowrap}
.empty{text-align:center;padding:60px;color:#999}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:#fff;width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:10px;padding:24px}
.modal h2{margin:0 0 20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:7px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:14px;font-weight:600}
.form-control{border:1px solid #ddd;border-radius:6px;padding:10px 12px}
textarea.form-control{min-height:80px;resize:vertical}
.preview{width:90px;height:90px;object-fit:cover;border:1px solid #ddd;border-radius:6px;display:none}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.note{font-size:12px;color:#888}
@media(max-width:700px){
 .app{padding:18px 12px}.topbar{align-items:flex-start;flex-direction:column}
 .tabs{overflow:auto;gap:22px}.filter-row{flex-direction:column}.select{min-width:0;width:100%}
 .form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}
 .summary{align-items:flex-start;gap:10px;flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Pesanan Saya</h1>
    <div>
      <button class="btn" onclick="exportData()">Export</button>
      <button class="btn" onclick="openModal()">+ Tambah Pesanan</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="Semua">Semua <span id="allCount"></span></div>
    <div class="tab" data-tab="Belum Diproses">Belum Diproses <span id="newCount"></span></div>
    <div class="tab" data-tab="Diproses">Diproses <span id="processCount"></span></div>
    <div class="tab" data-tab="Selesai">Selesai <span id="doneCount"></span></div>
  </div>

  <div class="filters">
    <div class="statuses">
      <span>Status Pesanan</span>
      <button class="pill active" data-stage="Semua">Semua</button>
      <button class="pill" data-stage="Maintenance Desain">Maintenance Desain</button>
      <button class="pill" data-stage="Print Press">Print Press</button>
      <button class="pill" data-stage="Jahit">Jahit</button>
      <button class="pill" data-stage="Kirim Ekspedisi">Kirim Ekspedisi</button>
    </div>
    <div class="filter-row">
      <input id="search" class="field search" placeholder="Masukkan no. pesanan / nama pembeli / produk" oninput="render()">
      <select id="filterStage" class="field select" onchange="render()">
        <option value="Semua">Semua Tahap</option>
        <option>Maintenance Desain</option>
        <option>Print Press</option>
        <option>Jahit</option>
        <option>Kirim Ekspedisi</option>
        <option>Selesai</option>
      </select>
      <button class="btn" onclick="resetFilter()">Atur Ulang</button>
    </div>
  </div>

  <div class="summary">
    <strong id="totalText">0 Pesanan</strong>
    <button class="btn primary" onclick="openModal()">+ Tambah Pesanan</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:39%">Produk</th>
          <th>No. Pesanan</th>
          <th>Pembeli</th>
          <th>Status / Tahap</th>
          <th>Link Desain</th>
          <th>Link Resi</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="orderBody"></tbody>
    </table>
  </div>
</div>

<div class="modal-bg" id="modalBg">
 <div class="modal">
  <h2 id="modalTitle">Tambah Pesanan</h2>
  <form id="orderForm">
   <input type="hidden" id="editId">
   <div class="form-grid">
    <div class="form-group">
      <label>No. Pesanan</label>
      <input id="orderNo" class="form-control" required placeholder="Contoh: 2609046C85624X">
    </div>
    <div class="form-group">
      <label>Nama Pembeli</label>
      <input id="buyer" class="form-control" required placeholder="Nama pembeli">
    </div>
    <div class="form-group full">
      <label>Nama Produk</label>
      <input id="product" class="form-control" required placeholder="Contoh: Setelan Anak Custom">
    </div>
    <div class="form-group">
      <label>Variasi / Catatan</label>
      <input id="variation" class="form-control" placeholder="Contoh: Yellow, M">
    </div>
    <div class="form-group">
      <label>Tahap Produksi</label>
      <select id="stage" class="form-control">
        <option>Maintenance Desain</option>
        <option>Print Press</option>
        <option>Jahit</option>
        <option>Kirim Ekspedisi</option>
        <option>Selesai</option>
      </select>
    </div>
    <div class="form-group full">
      <label>Foto Produk</label>
      <input id="photo" class="form-control" type="file" accept="image/*">
      <img id="preview" class="preview">
      <span class="note">Foto disimpan di browser ini. Gunakan gambar kecil agar penyimpanan tetap ringan.</span>
    </div>
    <div class="form-group full">
      <label>Link Google Drive Desain</label>
      <input id="designLink" class="form-control" type="url" placeholder="https://drive.google.com/...">
    </div>
    <div class="form-group full">
      <label>Link Google Drive Resi</label>
      <input id="receiptLink" class="form-control" type="url" placeholder="https://drive.google.com/...">
    </div>
    <div class="form-group full">
      <label>Catatan</label>
      <textarea id="notes" class="form-control" placeholder="Nama, nomor punggung, request custom, dll."></textarea>
    </div>
   </div>
   <div class="modal-actions">
    <button type="button" class="btn" onclick="closeModal()">Batal</button>
    <button type="submit" class="btn primary">Simpan Pesanan</button>
   </div>
  </form>
 </div>
</div>

<script>
const KEY='pesanan_jersey_v1';
let orders=JSON.parse(localStorage.getItem(KEY)||'[]');
let activeTab='Semua';
let activeStage='Semua';
let pendingPhoto='';

const $=id=>document.getElementById(id);

function save(){localStorage.setItem(KEY,JSON.stringify(orders));render();}

function openModal(id=null){
  $('modalBg').style.display='flex';
  $('modalTitle').textContent=id?'Edit Pesanan':'Tambah Pesanan';
  $('orderForm').reset(); $('editId').value=id||''; pendingPhoto='';
  $('preview').style.display='none';
  if(id){
    const o=orders.find(x=>x.id===id); if(!o)return;
    $('orderNo').value=o.orderNo; $('buyer').value=o.buyer; $('product').value=o.product;
    $('variation').value=o.variation||''; $('stage').value=o.stage;
    $('designLink').value=o.designLink||''; $('receiptLink').value=o.receiptLink||'';
    $('notes').value=o.notes||'';
    if(o.photo){$('preview').src=o.photo;$('preview').style.display='block';}
  }
}
function closeModal(){$('modalBg').style.display='none'}
$('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});

$('photo').addEventListener('change',e=>{
 const file=e.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{pendingPhoto=reader.result;$('preview').src=pendingPhoto;$('preview').style.display='block'};
 reader.readAsDataURL(file);
});

$('orderForm').addEventListener('submit',e=>{
 e.preventDefault();
 const id=$('editId').value;
 const old=id?orders.find(x=>x.id===id):null;
 const data={
  id:id||Date.now().toString(),
  orderNo:$('orderNo').value.trim(),buyer:$('buyer').value.trim(),
  product:$('product').value.trim(),variation:$('variation').value.trim(),
  stage:$('stage').value,designLink:$('designLink').value.trim(),
  receiptLink:$('receiptLink').value.trim(),notes:$('notes').value.trim(),
  photo:pendingPhoto||old?.photo||''
 };
 if(id) orders=orders.map(x=>x.id===id?data:x); else orders.unshift(data);
 save();closeModal();
});

function del(id){
 if(confirm('Hapus pesanan ini?')){orders=orders.filter(x=>x.id!==id);save();}
}
function edit(id){openModal(id)}
function advance(id){
 const seq=['Maintenance Desain','Print Press','Jahit','Kirim Ekspedisi','Selesai'];
 const o=orders.find(x=>x.id===id), i=seq.indexOf(o.stage);
 if(i<seq.length-1){o.stage=seq[i+1];save()}
}
function render(){
 const q=$('search').value.toLowerCase();
 const filter=$('filterStage').value;
 let list=orders.filter(o=>{
  const matchQ=!q||[o.orderNo,o.buyer,o.product,o.variation].join(' ').toLowerCase().includes(q);
  const matchTab=activeTab==='Semua'||(activeTab==='Belum Diproses'&&o.stage==='Maintenance Desain')||(activeTab==='Diproses'&&['Print Press','Jahit','Kirim Ekspedisi'].includes(o.stage))||(activeTab==='Selesai'&&o.stage==='Selesai');
  const matchStage=filter==='Semua'||o.stage===filter;
  return matchQ&&matchTab&&matchStage&&(activeStage==='Semua'||o.stage===activeStage);
 });
 $('totalText').textContent=list.length+' Pesanan';
 $('allCount').textContent=orders.length?`(${orders.length})`:'';
 $('newCount').textContent=orders.filter(o=>o.stage==='Maintenance Desain').length?`(${orders.filter(o=>o.stage==='Maintenance Desain').length})`:'';
 $('processCount').textContent=orders.filter(o=>['Print Press','Jahit','Kirim Ekspedisi'].includes(o.stage)).length?`(${orders.filter(o=>['Print Press','Jahit','Kirim Ekspedisi'].includes(o.stage)).length})`:'';
 $('doneCount').textContent=orders.filter(o=>o.stage==='Selesai').length?`(${orders.filter(o=>o.stage==='Selesai').length})`:'';

 $('orderBody').innerHTML=list.length?list.map(o=>`
 <tr>
  <td><div class="product">
   ${o.photo?`<img src="${o.photo}" alt="">`:`<div style="width:68px;height:68px;border:1px solid #ddd;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px">No Foto</div>`}
   <div><div class="product-title">${esc(o.product)}</div><div class="muted">${esc(o.variation||'Tanpa variasi')}</div>${o.notes?`<div class="muted">${esc(o.notes)}</div>`:''}</div>
  </div></td>
  <td>${esc(o.orderNo)}</td>
  <td>${esc(o.buyer)}</td>
  <td><span class="badge">${esc(o.stage)}</span>${o.stage!=='Selesai'?`<div class="stage"><button class="btn" style="padding:6px 10px;margin-top:5px" onclick="advance('${o.id}')">Lanjut Tahap →</button></div>`:''}</td>
  <td>${o.designLink?`<a class="link" href="${safeUrl(o.designLink)}" target="_blank">Lihat Desain</a>`:'<span class="muted">Belum ada</span>'}</td>
  <td>${o.receiptLink?`<a class="link" href="${safeUrl(o.receiptLink)}" target="_blank">Lihat Resi</a>`:'<span class="muted">Belum ada</span>'}</td>
  <td class="actions"><button class="btn" onclick="edit('${o.id}')">Edit</button> <button class="btn danger" onclick="del('${o.id}')">Hapus</button></td>
 </tr>`).join(''):`<tr><td colspan="7" class="empty">Belum ada pesanan. Klik “+ Tambah Pesanan” untuk memasukkan order.</td></tr>`;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function safeUrl(s){try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?esc(u.href):'#'}catch{return '#'}}
function resetFilter(){$('search').value='';$('filterStage').value='Semua';activeStage='Semua';document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));document.querySelector('.pill[data-stage="Semua"]').classList.add('active');render()}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');activeTab=t.dataset.tab;render();
});
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
 document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');activeStage=p.dataset.stage;render();
});

function exportData(){
 const blob=new Blob([JSON.stringify(orders,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pesanan-jersey.json';a.click();URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
